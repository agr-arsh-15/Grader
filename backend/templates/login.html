<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — AI Assessment Grading Portal</title>
  <meta name="description" content="Sign in to access your assessment tasks or manage coding assessments" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
  <link rel="stylesheet" href="/static/style.css?v=5.1" />
</head>
<body class="login-body">
<div class="login-page">
  <div class="login-glow-orb orb-1"></div>
  <div class="login-glow-orb orb-2"></div>

  <div class="login-box card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="loginLogoBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4F46E5"/>
              <stop offset="48%" stop-color="#7C3AED"/>
              <stop offset="100%" stop-color="#06B6D4"/>
            </linearGradient>
            <linearGradient id="loginLogoCheck" x1="14" y1="16" x2="28" y2="12" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#67E8F9"/>
            </linearGradient>
            <linearGradient id="loginLogoSpark" x1="24" y1="4" x2="29" y2="9" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FDE047"/>
              <stop offset="100%" stop-color="#F59E0B"/>
            </linearGradient>
          </defs>
          <rect width="36" height="36" rx="10" fill="url(#loginLogoBg)"/>
          <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="9.25" stroke="rgba(255, 255, 255, 0.24)" stroke-width="1.5"/>
          <path d="M12.5 12L7.5 17.5C7.2 17.8 7.2 18.2 7.5 18.5L12.5 24" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14.5 18.5L18.5 22.5L27.5 12" stroke="url(#loginLogoCheck)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M26.5 4.5C26.5 5.8 27.5 6.8 28.8 6.8C27.5 6.8 26.5 7.8 26.5 9.1C26.5 7.8 25.5 6.8 24.2 6.8C25.5 6.8 26.5 5.8 26.5 4.5Z" fill="url(#loginLogoSpark)"/>
        </svg>
      </div>
      <h1 class="login-title">Grader<span class="brand-accent">.ai</span></h1>
      <p class="login-subtitle">AI-Assisted Coding Assessment Platform</p>
    </div>

    {% if error %}
    <div class="alert alert-error" role="alert">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="/auth/login" method="POST" id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input
          id="email"
          type="email"
          name="email"
          class="form-control"
          placeholder="name@company.com"
          required
          autocomplete="email"
          autofocus
        />
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.4rem;">
          <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
          <button type="button" class="btn-text" onclick="togglePasswordVisibility()" id="toggle-pwd-btn" style="font-size:0.75rem; color:var(--text-muted); background:none; border:none; cursor:pointer;">
            Show
          </button>
        </div>
        <input
          id="password"
          type="password"
          name="password"
          class="form-control"
          placeholder="••••••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button id="login-btn" type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.8rem; font-size:0.95rem; margin-top:0.5rem;">
        Sign In to Portal →
      </button>
    </form>
  </div>
</div>

<script>
  function togglePasswordVisibility() {

    const input = document.getElementById('password');
    const btn = document.getElementById('toggle-pwd-btn');
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'Hide';
    } else {
      input.type = 'password';
      btn.textContent = 'Show';
    }
  }

  document.getElementById('login-form').addEventListener('submit', function() {
    setTimeout(function() {
      const btn = document.getElementById('login-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Authenticating…';
      }
    }, 10);
  });
</script>
<script src="/static/app.js"></script>
</body>
</html>
